name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    uses: ./.github/workflows/build.yml

  docker:
    needs: quality
    uses: ./.github/workflows/docker-build.yml

  test-e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml