name: Cypress E2E

on:
  workflow_call:

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      # -------------------------
      # Download artifacts
      # -------------------------

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/apps/frontend

      - name: Download backend runtime
        uses: actions/download-artifact@v4
        with:
          name: backend-runtime
          path: apps/backend

      # -------------------------
      # Start PocketBase
      # -------------------------

      - name: Start PocketBase
        run: |
          chmod +x apps/backend/pocketbase
          ./apps/backend/pocketbase serve --http=0.0.0.0:8090 &
          npx wait-on http://127.0.0.1:8090/_/

      # -------------------------
      # Start frontend
      # -------------------------

      - name: Serve frontend
        run: |
          npx serve -s dist/apps/frontend -l 4200 &
          npx wait-on http://127.0.0.1:4200

      # -------------------------
      # Cypress
      # -------------------------

      - name: Run Cypress
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4200
          VITE_POCKETBASE_URL: http://127.0.0.1:8090
        run: |
          npx cypress run \
            --config-file apps/frontend/cypress/cypress.config.ts \
            --spec 'apps/frontend/cypress/e2e/{auth,dashboard,presets,stations}/*.cy.ts'
