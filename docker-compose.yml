  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./apps/n8n/data:/home/node/.n8n
    restart: unless-stopped