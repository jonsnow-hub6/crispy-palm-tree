version: '3.8'

services:
  server:
    container_name: splinter-server
    image: /splinter-server:dev
    ports:
      - "8090:8090"

  client:
    image: /splinter-client:dev
    container_name: splinter-client
    environment:
      - SERVER_URL=splinter-server:8090
    ports:
      - "4200:4200"
    depends_on:
      - server

  n8n:
    image: n8nio/n8n:latest
    container_name: splinter-n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./apps/n8n/data:/home/node/.n8n
    restart: always
    