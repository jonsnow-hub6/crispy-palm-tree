  n8n:
    image: n8nio/n8n:latest
    container_name: splinter-n8n
    ports:
      - '5678:5678'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - TZ=Asia/Jerusalem
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SERVER_API_URL=http://host.docker.internal:8090/api
    volumes:
      - ./apps/n8n/data:/home/node/.n8n
      - ./splinter_cron_flow.json:/home/node/splinter_cron_flow.json
    restart: unless-stopped
